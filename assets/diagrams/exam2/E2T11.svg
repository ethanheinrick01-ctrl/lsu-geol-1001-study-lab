<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Pressure–temperature paths: A increases pressure at similar temperature, B heats at similar pressure, C increases both pressure and temperature. No path crosses a melting boundary."><defs><marker id="e2arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#f2bc67"/></marker></defs><rect width="960" height="460" fill="#0c1a2b"/><rect x="170" y="70" width="650" height="290" rx="3" fill="#233b51"/><path d="M170 360L820 360" stroke="#f2bc67" stroke-width="5" marker-end="url(#e2arrow)"/><path d="M170 75L170 355" stroke="#f2bc67" stroke-width="5" marker-end="url(#e2arrow)"/><text x="495" y="402" text-anchor="middle" fill="#e7eef4" font-size="23" font-family="Arial,sans-serif">Temperature increases →</text><text x="100" y="208" text-anchor="middle" fill="#e7eef4" font-size="22" font-family="Arial,sans-serif">Pressure</text><text x="300" y="117" text-anchor="middle" fill="#e7eef4" font-size="24" font-family="Arial,sans-serif">A</text><path d="M285 145L285 278" stroke="#f2bc67" stroke-width="5" marker-end="url(#e2arrow)"/><text x="617" y="145" text-anchor="middle" fill="#e7eef4" font-size="24" font-family="Arial,sans-serif">B</text><path d="M480 164L730 164" stroke="#f2bc67" stroke-width="5" marker-end="url(#e2arrow)"/><text x="589" y="318" text-anchor="middle" fill="#e7eef4" font-size="24" font-family="Arial,sans-serif">C</text><path d="M410 260L672 339" stroke="#f2bc67" stroke-width="5" marker-end="url(#e2arrow)"/><text x="510" y="435" text-anchor="middle" fill="#e7eef4" font-size="18" font-family="Arial,sans-serif">All three paths remain in solid-state metamorphic conditions.</text></svg>